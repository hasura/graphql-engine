#Create a table an concurrent index in a transaction
- url: /v1/query
  status: 400
  response:
    error: query execution failed
    path: $.args
    code: postgres-error
    internal:
      arguments: []
      error:
        description:
        exec_status: FatalError
        hint:
        message: CREATE INDEX CONCURRENTLY cannot run inside a transaction block
        status_code: '25001'
      prepared: false
      statement: "CREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    name VARCHAR(100)
        NOT NULL,\n    email VARCHAR(100) UNIQUE,\n    created_at TIMESTAMP WITHOUT
        TIME ZONE DEFAULT (NOW() AT TIME ZONE 'UTC')\n);\n-- Creating a concurrent
        index in a transaction is not allowed\nCREATE INDEX CONCURRENTLY index_users_created_at
        ON users (created_at);\n"
  query:
    type: run_sql
    args:
      sql: |
        CREATE TABLE users (
            id SERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(100) UNIQUE,
            created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT (NOW() AT TIME ZONE 'UTC')
        );
        -- Creating a concurrent index in a transaction is not allowed
        CREATE INDEX CONCURRENTLY index_users_created_at ON users (created_at);
      no_transaction: false


#Create a table an concurrent index without a transaction
- url: /v1/query
  status: 200
  response:
    result_type: CommandOk
    result:
  query:
    type: run_sql
    args:
      sql: |
        CREATE TABLE users (
            id SERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(100) UNIQUE,
            created_at TIMESTAMP WITHOUT TIME ZONE DEFAULT (NOW() AT TIME ZONE 'UTC')
        );
        -- Creating a concurrent index without a transaction is allowed
        CREATE INDEX CONCURRENTLY index_users_created_at ON users (created_at);
      no_transaction: true

#Revert changes
- url: /v1/query
  status: 200
  response:
    result_type: CommandOk
    result:
  query:
    type: run_sql
    args:
      sql: |
        DROP TABLE users;

# Dollar-quoted PL/pgSQL blocks must remain intact with no_transaction enabled.
- url: /v1/query
  status: 200
  response:
    result_type: CommandOk
    result:
  query:
    type: run_sql
    args:
      sql: |
        DO $$ BEGIN IF 'x' ~ '^x$' THEN NULL; END IF; END $$;
      no_transaction: true

# A dollar-quoted function body may contain positional parameters and other tags.
# Keep splitting real statements after the closing delimiter and return the last result.
- url: /v1/query
  status: 200
  response:
    result_type: TuplesOk
    result:
    - [result]
    - [x]
  query:
    type: run_sql
    args:
      sql: |
        CREATE FUNCTION run_sql_dollar_quote_regression(value text)
        RETURNS text AS $$
        BEGIN
          IF $1 ~ '^x$' AND $1 = $value$x$value$ THEN
            RETURN $1;
          END IF;
          RETURN NULL;
        END;
        $$ LANGUAGE plpgsql;
        SELECT run_sql_dollar_quote_regression('x') AS result;
      no_transaction: true

# Revert the function created by the dollar-quote regression test.
- url: /v1/query
  status: 200
  response:
    result_type: CommandOk
    result:
  query:
    type: run_sql
    args:
      sql: DROP FUNCTION run_sql_dollar_quote_regression(text);
