# Regression: the table/column/function in `schema_setup.yaml` have database
# COMMENT ONs but no metadata comments. Importing database COMMENTs into the
# GraphQL schema is deprecated, so those DB comments must be IGNORED: the table
# description falls back to the autogenerated one, the column description is null,
# and the computed-field description falls back to its autogenerated default.
description: GraphQL introspection ignores database COMMENTs (table/column/function)
url: /v1/graphql
status: 200
query:
  query: |
    query IntrospectionQuery {
      __type(name: "automatic_comment_in_db") {
        name
        description
        kind
        fields {
          name
          description
        }
      }
    }
response:
  data:
    __type:
      name: automatic_comment_in_db
      description: columns and relationships of "automatic_comment_in_db"
      kind: OBJECT
      fields:
      - name: id
        description: null
      - name: name
        description: null
      - name: upper_name
        description: A computed field, executes function "automatic_comment_in_db_upper_name"
