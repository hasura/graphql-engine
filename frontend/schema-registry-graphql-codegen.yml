overwrite: true
schema:
  - 'http://schema-registry.lux-dev.hasura.me/v1/graphql':
      headers:
        'x-hasura-admin-secret': 'randomsecret'
documents: 'libs/console/legacy-ce/src/lib/features/SchemaRegistry/queries.ts'
generates:
  libs/console/legacy-ce/src/lib/features/SchemaRegistry/generatedGraphQLTypes.ts:
    plugins: ['typescript-operations']
    config:
      # Generate enums as TypeScript enums (not unions)
      enumType: native
      # Map custom scalars to TypeScript types
      scalars:
        uuid: string
        timestamptz: string
        timestamp: string
        date: string
        jsonb: any
        json: any
        tsvector: any
        # BigInts are encoded as strings to ensure large numbers are supported
        bigint: string
        numeric: number
        bytea: string
        citext: string
        float8: number
        _uuid: any
